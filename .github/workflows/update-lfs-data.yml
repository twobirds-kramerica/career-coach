name: Update StatCan LFS Unemployment Data

on:
  schedule:
    # Every Friday at 13:00 UTC. StatCan publishes the Labour Force Survey on a
    # Friday, but not a predictable ordinal one, so we check weekly rather than
    # guess a date. The previous expression, '0 9 1-7 * 5', did NOT mean "first
    # Friday": cron ORs a restricted day-of-month with a restricted day-of-week,
    # so it fired on days 1-7 AND every Friday, about 11 times a month.
    - cron: '0 13 * * 5'
  workflow_dispatch:

jobs:
  update-lfs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Both fetches pull large files from StatCan and a single transient failure
      # silently froze the site's data for a week on 2026-08-04. Retry twice
      # before giving up.
      - name: Fetch latest LFS data from StatCan
        run: |
          for attempt in 1 2 3; do
            python scripts/fetch-lfs.py && exit 0
            echo "Attempt $attempt failed; retrying in 60s"
            sleep 60
          done
          exit 1

      - name: Fetch hiring-trend series from StatCan
        run: |
          for attempt in 1 2 3; do
            python scripts/fetch-hiring-trends.py && exit 0
            echo "Attempt $attempt failed; retrying in 60s"
            sleep 60
          done
          exit 1

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet data/lfs-unemployment.json data/hiring-trends.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push if updated
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          REF=$(python -c "import json; d=json.load(open('data/lfs-unemployment.json')); print(d['reference_period'])")
          RATE=$(python -c "import json; d=json.load(open('data/lfs-unemployment.json')); print(d['rate'])")
          git add data/lfs-unemployment.json data/hiring-trends.json
          git commit -m "data(lfs): StatCan unemployment ${RATE}% — ${REF}"
          git push
